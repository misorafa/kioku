<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>kioku short</title>
<style>
:root{--bg:#f6f7fb;--fg:#141922;--mute:#5f6b7a;--blue:#1b6ef3;--orange:#f0732a;--green:#15a36b;--card:#ffffff;--line:#e3e7ee;--shadow:0 18px 50px rgba(20,25,34,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",Arial,sans-serif;font-feature-settings:"palt"}
.mono{font-family:Menlo,"SF Mono",Consolas,monospace}
#bg{position:absolute;inset:-10%;background:
  radial-gradient(800px 800px at 15% 12%,rgba(27,110,243,.16),transparent 60%),
  radial-gradient(900px 900px at 90% 85%,rgba(240,115,42,.16),transparent 60%),
  radial-gradient(700px 700px at 70% 30%,rgba(21,163,107,.10),transparent 60%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,-70px) scale(1.08)}}
.scene{position:absolute;inset:0;padding:110px 80px 170px;display:flex;flex-direction:column;justify-content:center;gap:36px;
  opacity:0;transform:translateY(70px);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.scene.show{opacity:1;transform:none}
.scene.out{opacity:0;transform:translateY(-70px)}
.item{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .4s ease var(--d,0s),transform .5s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.show .item{opacity:1;transform:none}
.kicker{font-size:44px;color:var(--mute);font-weight:700;letter-spacing:.02em}
h1{font-size:104px;line-height:1.12;font-weight:900;letter-spacing:-.01em}
h1 .hi{color:var(--blue)}h1 .warm{color:var(--orange)}
h2{font-size:76px;line-height:1.2;font-weight:900}
p.big .hi{color:var(--blue);font-weight:900}
p.big{font-size:50px;line-height:1.45;color:#2a3340;font-weight:600}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:36px;padding:38px 46px;font-size:50px;line-height:1.4;font-weight:700;max-width:900px;box-shadow:var(--shadow)}
.bubble .who{display:inline-block;font-size:32px;font-weight:800;padding:8px 20px;border-radius:999px;margin-bottom:16px}
.bubble.a .who{background:rgba(27,110,243,.12);color:var(--blue)}
.bubble.b{align-self:flex-end;border-color:rgba(240,115,42,.45)}
.bubble.b .who{background:rgba(240,115,42,.14);color:var(--orange)}
.badges{display:flex;gap:26px;flex-wrap:wrap}
.badge{font-size:44px;font-weight:800;padding:22px 34px;border-radius:24px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.badge.q::after{content:" ??";color:var(--orange)}
.logo{font-size:220px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--fg)}
.logo small{display:block;font-size:84px;color:var(--blue);font-weight:900;letter-spacing:.3em;margin-top:8px;padding-left:.3em}
.steps{display:flex;flex-direction:column;gap:26px}
.step{display:flex;align-items:flex-start;gap:30px;background:var(--card);border:2px solid var(--line);border-radius:32px;padding:32px 40px;box-shadow:var(--shadow)}
.step .n{font-size:64px;font-weight:900;color:var(--blue);line-height:1;min-width:70px}
.step .t{font-size:58px;font-weight:900;line-height:1.15}
.step .s{font-size:38px;color:var(--mute);margin-top:12px;line-height:1.35;font-weight:600}
.arrow{align-self:center;font-size:56px;color:var(--mute);line-height:1;margin:-8px 0}
.term{background:#1b2130;color:#eef2f8;border-radius:28px;padding:38px 42px;font-size:36px;line-height:1.5;white-space:pre-wrap;word-break:break-all;box-shadow:var(--shadow)}
.term .c{color:#8b97a8}.term .k{color:#7cc4ff;font-weight:700}.term .w{color:#ffb070}.term .g{color:#6fe3a5}
.term.big{font-size:42px}
.block{background:var(--card);border:2px solid var(--line);border-radius:32px;padding:34px 42px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.block .h{font-size:44px;font-weight:900;color:var(--blue);margin-top:12px}
.block .h:first-child{margin-top:0}
.block .l{font-size:40px;line-height:1.35;font-weight:600;color:#1f2733}
.block .l.warn{color:var(--orange)}
.block .l.ok{color:var(--green)}
.hit{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 36px;box-shadow:var(--shadow)}
.hit .p{font-size:30px;color:var(--mute)}
.hit .t{font-size:44px;font-weight:900;margin:8px 0}
.hit .x{font-size:36px;color:#2a3340;line-height:1.4;font-weight:600}
.hit mark{background:rgba(240,115,42,.25);color:var(--fg);border-radius:8px;padding:0 6px}
.jp{display:flex;flex-direction:column;gap:22px}
.jp .row{display:flex;align-items:center;gap:26px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px 34px;box-shadow:var(--shadow);font-size:46px;font-weight:800}
.jp .row .ic{font-size:52px;color:var(--green);min-width:60px;text-align:center}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;justify-content:space-between;align-items:center;font-size:34px;color:var(--mute);font-weight:700}
.foot b{color:var(--fg)}
#bar{position:absolute;left:0;bottom:0;height:12px;background:var(--blue);width:0}
.end .logo{font-size:170px}
.tags{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.tag{font-size:40px;font-weight:800;padding:16px 28px;border-radius:999px;background:rgba(21,163,107,.12);color:var(--green);border:2px solid rgba(21,163,107,.35)}
.url{font-size:60px;font-weight:900;color:var(--fg)}
</style>
<body>
<div id="bg"></div>
<div id="root"></div>
<div class="foot"><span><b>kioku</b> <span id="foot-sub"></span></span><span>github.com/misorafa/kioku</span></div>
<div id="bar"></div>
<script>
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') === 'en' ? 'en' : 'ja';
document.documentElement.lang = LANG;
document.getElementById('foot-sub').textContent = LANG === 'ja' ? '— 記憶' : '— memory for coding agents';

const T = {
ja: {
 s1k: 'きのう、Claude Code で', s1a: 'ログイン画面の検証、直しておいたよ。テストも追加した。',
 s1k2: 'きょう、Codex に続きを頼むと…', s1b: 'どのログイン画面のことでしょうか？',
 s1h: ['エージェントを<br>変えると、', '<span class="warm">記憶はゼロから。</span>'],
 s2h: ['マシンを変えても、', '<span class="warm">ゼロから。</span>'], s2b: ['MacBook', 'Windows', 'Mac mini'],
 s3sub: '<span class="hi">Rust</span> 製の、速くて安全なシングルバイナリ。<br>すべてのエージェント・すべてのマシンで共有する、<br>あなた専用の記憶サーバー。',
 sjk: '日本語のために作りました', sjh: ['<span class="hi">日本語</span>のまま、<br>覚える。'],
 sj: ['日本語の指示・要約・引き継ぎをそのまま保存', '日本語の全文検索（形態素解析つき）', '「引継」でも「引き継ぎ書」が見つかる'],
 s4k: 'しくみは 3 つだけ',
 s4: [['記録', 'フックが指示・編集・最後の回答を自動で送る'], ['要約', 'サーバーが引き継ぎと決定事項にまとめる（LLM は使わない）'], ['注入', '次のセッションが、どのエージェントでも続きから始まる']],
 s5k: '次のセッションは、こう始まる',
 s5: [['h', '前回からの引き継ぎ'], ['l', 'パスワード再設定画面にもメール検証を追加'], ['h', '次にやること'], ['l', '・エラーメッセージの日本語訳を埋める'], ['h', '決定事項（これまでの引き継ぎ）'], ['l', '・エラーは i18n キーで返す'], ['h', '落とし穴'], ['l warn', '⚠ cargo test は DB のマイグレーションを先に'], ['h', '最近のセッション'], ['l', '・codex @win-pc　・claude-code @macbook']],
 s6k: '日本語のまま検索できる',
 s6cmd: '<span class="k">kioku_query</span> "<span class="w">メール検証</span>"',
 s6: [['sessions/2026-10-04 … @win-pc', 'パスワード再設定画面に同じ検証を入れて', '… <mark>メール検証</mark>を追加。i18n キーの一覧を起こした'], ['pages/auth-design.md', '認証まわりの設計メモ', 'ログインの<mark>検証</mark>順序：<mark>メール</mark> → パスワード → 2FA']],
 s7k: '導入は 1 行', s7h: ['自宅の Mac mini でも、<br>Docker でも。'],
 s7cmd: '<span class="c"># サーバー</span>\ncurl -fsSL …/install.sh | sh\n\n<span class="c"># ほかのマシンは招待コードを 1 行</span>\n<span class="k">KIOKU_JOIN</span>=\'mini:7391/K7Q2M9XD\' sh -c "$(curl -fsSL …/install.sh)"',
 s8tags: ['無料', 'オープンソース', 'Rust 製', 'LLM を呼ばない', 'データは自分のサーバーに'], s8sub: 'Claude Code / Codex / Cursor / Antigravity',
},
en: {
 s1k: 'Yesterday, in Claude Code', s1a: 'Fixed the login validation and added tests.',
 s1k2: 'Today, asking Codex to continue…', s1b: 'Which login screen do you mean?',
 s1h: ['Switch agents,', '<span class="warm">memory starts at zero.</span>'],
 s2h: ['Switch machines,', '<span class="warm">zero again.</span>'], s2b: ['MacBook', 'Windows', 'Mac mini'],
 s3sub: 'A fast, memory-safe single binary written in <span class="hi">Rust</span>.<br>One memory server, shared by every coding agent<br>on every machine you own.',
 sjk: 'Built Japanese-first', sjh: ['Real <span class="hi">Japanese</span> search.<br>English too.'],
 sj: ['Japanese prompts, summaries and handoffs kept as written', 'Full-text search with morphological analysis', 'English works exactly the same way'],
 s4k: 'Three steps, that’s all',
 s4: [['Capture', 'Hooks send prompts, edits and the final reply automatically'], ['Summarize', 'The server writes handoffs and decisions (no LLM calls)'], ['Inject', 'The next session — any agent — starts where you left off']],
 s5k: 'How the next session starts',
 s5: [['h', 'Handoff from the previous session'], ['l', 'Address step validates the email too'], ['h', 'Next steps'], ['l', '• Fill in the Japanese translations'], ['h', 'Decisions (carried)'], ['l', '• Errors are returned as i18n keys'], ['h', 'Gotchas'], ['l warn', '⚠ npm test needs the mock payment server'], ['h', 'Recent sessions'], ['l', '• codex @win-pc • claude-code @macbook']],
 s6k: 'Search in Japanese or English',
 s6cmd: '<span class="k">kioku_query</span> "<span class="w">email validation</span>"',
 s6: [['sessions/2026-10-04 … @win-pc', 'Apply the same validation to the address step', '… validates the <mark>email</mark> too; listed every i18n key'], ['pages/checkout-design.md', 'Checkout design notes', '<mark>Validation</mark> order: <mark>email</mark>, then card, then address']],
 s7k: 'Install in one line', s7h: ['On a Mac mini at home,<br>or in Docker.'],
 s7cmd: '<span class="c"># server</span>\ncurl -fsSL …/install.sh | sh\n\n<span class="c"># every other machine: paste the invite line</span>\n<span class="k">KIOKU_JOIN</span>=\'mini:7391/K7Q2M9XD\' sh -c "$(curl -fsSL …/install.sh)"',
 s8tags: ['Free', 'Open source', 'Written in Rust', 'No LLM calls', 'Your data on your server'], s8sub: 'Claude Code / Codex / Cursor / Antigravity',
}}[LANG];

const d = (i, step = .22, base = .1) => `style="--d:${(base + i * step).toFixed(2)}s"`;
const scenes = [
`<div class="scene" id="s1">
  <div class="kicker item" ${d(0)}>${T.s1k}</div>
  <div class="bubble a item" ${d(1)}><span class="who">Claude Code</span><br>${T.s1a}</div>
  <div class="kicker item" ${d(4,.22)}>${T.s1k2}</div>
  <div class="bubble b item" ${d(5,.22)}><span class="who">Codex</span><br><span id="tw"></span></div>
  <h1 class="item" ${d(9,.3)}>${T.s1h[0]}<br>${T.s1h[1]}</h1>
</div>`,
`<div class="scene" id="s2">
  <h1 class="item" ${d(0)}>${T.s2h[0]}<br>${T.s2h[1]}</h1>
  <div class="badges">${T.s2b.map((b,i)=>`<div class="badge q item" ${d(i+2,.3)}>${b}</div>`).join('')}</div>
</div>`,
`<div class="scene" id="s3" style="align-items:center;text-align:center">
  <div class="logo item" ${d(0)}>kioku<small>記憶</small></div>
  <p class="big item" ${d(2,.3)}>${T.s3sub}</p>
</div>`,
`<div class="scene" id="sj">
  <div class="kicker item" ${d(0)}>${T.sjk}</div>
  <h1 class="item" ${d(1)}>${T.sjh[0]}</h1>
  <div class="jp">${T.sj.map((r,i)=>`<div class="row item" ${d(i+3,.3)}><span class="ic">✓</span><span>${r}</span></div>`).join('')}</div>
</div>`,
`<div class="scene" id="s4">
  <div class="kicker item" ${d(0)}>${T.s4k}</div>
  <div class="steps">${T.s4.map((s,i)=>`${i?`<div class="arrow item" ${d(i*2,.4)}>↓</div>`:''}<div class="step item" ${d(i*2+1,.4)}><div class="n">${i+1}</div><div><div class="t">${s[0]}</div><div class="s">${s[1]}</div></div></div>`).join('')}</div>
</div>`,
`<div class="scene" id="s5">
  <div class="kicker item" ${d(0)}>${T.s5k}</div>
  <div class="block item" ${d(1)}>${T.s5.map((l,i)=>`<div class="${l[0]} item" ${d(i+2,.28)}>${l[1]}</div>`).join('')}</div>
</div>`,
`<div class="scene" id="s6">
  <div class="kicker item" ${d(0)}>${T.s6k}</div>
  <div class="term big mono item" ${d(1)}>${T.s6cmd}</div>
  ${T.s6.map((h,i)=>`<div class="hit item" ${d(i*2+3,.35)}><div class="p mono">${h[0]}</div><div class="t">${h[1]}</div><div class="x">${h[2]}</div></div>`).join('')}
</div>`,
`<div class="scene" id="s7">
  <div class="kicker item" ${d(0)}>${T.s7k}</div>
  <h2 class="item" ${d(1)}>${T.s7h[0]}</h2>
  <div class="term mono item" ${d(3,.3)}>${T.s7cmd}</div>
</div>`,
`<div class="scene end" id="s8" style="align-items:center;text-align:center">
  <div class="logo item" ${d(0)}>kioku<small>記憶</small></div>
  <div class="tags">${T.s8tags.map((t,i)=>`<div class="tag item" ${d(i+2,.22)}>${t}</div>`).join('')}</div>
  <p class="big item" ${d(7)}>${T.s8sub}</p>
  <div class="url mono item" ${d(8)}>github.com/misorafa/kioku</div>
</div>`];
document.getElementById('root').innerHTML = scenes.join('');

// Scene start times (seconds) come from the narration lengths: ?starts=0,7.2,…&total=52
const starts = (Q.get('starts') || '0,7,11,15.5,21,28.5,36.5,41,46.5').split(',').map(Number);
const TOTAL = Number(Q.get('total') || 53);
const ids = ['s1','s2','s3','sj','s4','s5','s6','s7','s8'];
const els = ids.map(id => document.getElementById(id));
let twTimer = null;
function typewrite(text) {
  const el = document.getElementById('tw'); el.textContent = ''; let i = 0; clearInterval(twTimer);
  twTimer = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(twTimer); }, 45);
}
function show(k) {
  els.forEach((e, i) => { e.classList.toggle('show', i === k); e.classList.toggle('out', i < k); });
  if (k === 0) setTimeout(() => typewrite(T.s1b), 1500);
}
window.seek = (t) => { let k = 0; starts.forEach((s, i) => { if (t >= s) k = i; }); show(k);
  document.getElementById('bar').style.width = (Math.min(t, TOTAL) / TOTAL * 1080) + 'px'; };
if (!Q.has('still')) {
  const t0 = performance.now();
  starts.forEach((s, i) => setTimeout(() => show(i), s * 1000));
  (function tick(){ const t = (performance.now() - t0) / 1000; document.getElementById('bar').style.width = (Math.min(t, TOTAL) / TOTAL * 1080) + 'px'; if (t < TOTAL) requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
