name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings
      # Includes M2.6 fault/recovery regression and Japanese Recall@3 / MRR evaluation.
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast

  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh scripts/test-install.sh
      - name: install.sh tests (sh)
        run: sh scripts/test-install.sh
      - name: install.sh tests (dash)
        if: runner.os == 'Linux'
        run: KIOKU_TEST_SH=dash dash scripts/test-install.sh

  # SPEC-M2.2 §6.7: install.ps1 against a local fixture server, under PowerShell 7 and
  # Windows PowerShell 5.1, plus the real kioku.exe (setup refusal, hook stdin, update).
  install-ps1:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build kioku.exe
        run: cargo build --locked -p kioku-cli
      - name: install.ps1 tests (pwsh)
        shell: pwsh
        env:
          KIOKU_TEST_PS: pwsh
          KIOKU_TEST_REAL_BIN: target\debug\kioku.exe
        run: ./scripts/test-install.ps1
      - name: install.ps1 tests (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          KIOKU_TEST_PS: powershell
        run: ./scripts/test-install.ps1
