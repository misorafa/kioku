name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Static musl binaries run on any distro (the gnu builds need ubuntu-latest's
          # glibc, which e.g. Ubuntu 22.04 servers lack); install.sh tries musl first.
          # Verified by the v0.3.0 release (SPEC-M2 §18 #12). Should they ever break: delete
          # them and pin the two gnu jobs above to `os: ubuntu-22.04` instead (install.sh then
          # falls back from the missing musl asset to gnu by itself).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # SPEC-M2.2 §3: the Windows client (kioku.exe). Not code-signed: SmartScreen may warn.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p kioku-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p kioku-cli --target ${{ matrix.target }}
          fi
      # SPEC-M2 §10.3.1: Developer ID signature (+ notarization) when the secrets exist, so
      # firewalls and Local Network privacy keep recognising kioku across updates; otherwise
      # ad hoc with the stable identifier dev.kioku.kioku.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: sh scripts/sign-macos.sh "target/${{ matrix.target }}/release/kioku"
      - name: Package
        shell: bash
        run: |
          name="kioku-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin=kioku
          if [ "${{ runner.os }}" = Windows ]; then bin=kioku.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md README.ja.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$name.tar.gz" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$name.tar.gz" | cut -d' ' -f1)
          fi
          # `<hex>  <file>` on every OS (Git Bash's sha256sum may mark binary mode with `*`).
          printf '%s  %s\n' "$sum" "$name.tar.gz" > "$name.tar.gz.sha256"
          # winget accepts zip, not tar.gz: Windows also ships a zip with kioku.exe at its root
          # (manifest: InstallerType zip, NestedInstallerType portable; packaging/winget/).
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$name/*' -DestinationPath '$name.zip'"
            zsum=$(sha256sum "$name.zip" | cut -d' ' -f1)
            printf '%s  %s\n' "$zsum" "$name.zip" > "$name.zip.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kioku-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        # One file with every asset's checksum; install.sh verifies against it (and falls
        # back to <asset>.sha256 for releases that predate it).
        run: |
          cd dist && cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release tag (`v1.2.3-rc1`, `v0.0.0-test1`) makes a GitHub pre-release, which
        # never becomes `releases/latest` (what install.sh, install.ps1 and `kioku update` use).
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  winget:
    name: winget
    needs: release
    # Pre-release tags (`v1.2.3-rc1`) never go to winget.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  # SPEC-M3.3 §2: ghcr.io/<owner>/kioku:<tag> (and :latest for a stable tag), linux/amd64 +
  # linux/arm64, built from the release's own musl tarballs (checksums verified against
  # SHA256SUMS) — no source build. Uses GITHUB_TOKEN with packages: write.
  docker:
    name: Docker image (ghcr.io)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the musl binaries of the release
        id: bins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          mkdir -p dl ctx/linux/amd64 ctx/linux/arm64
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern "kioku-$tag-x86_64-unknown-linux-musl.tar.gz" \
            --pattern "kioku-$tag-aarch64-unknown-linux-musl.tar.gz" \
            --pattern SHA256SUMS
          (cd dl && grep -E "  kioku-$tag-(x86_64|aarch64)-unknown-linux-musl\.tar\.gz\$" SHA256SUMS | sha256sum -c -)
          for pair in x86_64:amd64 aarch64:arm64; do
            triple="${pair%%:*}-unknown-linux-musl"
            tar -xzf "dl/kioku-$tag-$triple.tar.gz" -C dl
            install -m 0755 "dl/kioku-$tag-$triple/kioku" "ctx/linux/${pair##*:}/kioku"
          done
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$tag"
          # A pre-release (`v1.2.3-rc1`) never becomes :latest.
          case "$tag" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.bins.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=kioku: self-hosted, Japanese-first shared memory for AI coding agents

  # SPEC-M3.3 §1: render Formula/kioku.rb (packaging/homebrew/kioku.rb.tmpl) with the tag and
  # the four macOS / Linux-musl checksums and push it to misorafa/homebrew-tap. Needs the
  # TAP_TOKEN secret (fine-grained PAT, contents: write on that repository only); while it is
  # unset — or the tap cannot be reached — this is a notice, never a failed release.
  homebrew:
    name: Homebrew tap
    needs: release
    # Pre-release tags (`v1.2.3-rc1`) never go to the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check for TAP_TOKEN
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TAP_TOKEN is not set: skipping the Homebrew tap update"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Formula/kioku.rb
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dl --pattern SHA256SUMS
          sh scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" dl/SHA256SUMS > kioku.rb
          cat kioku.rb
      - name: Push to misorafa/homebrew-tap
        if: steps.token.outputs.present == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -eu
          if ! git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/misorafa/homebrew-tap.git" tap; then
            echo "::notice::misorafa/homebrew-tap is not reachable with TAP_TOKEN: skipping the Homebrew tap update"
            exit 0
          fi
          mkdir -p tap/Formula
          cp kioku.rb tap/Formula/kioku.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kioku.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula/kioku.rb is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -q -m "kioku $GITHUB_REF_NAME"
          git push -q origin HEAD
