name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Static musl binaries run on any distro (the gnu builds need ubuntu-latest's
          # glibc, which e.g. Ubuntu 22.04 servers lack); install.sh tries musl first.
          # Verified by the v0.3.0 release (SPEC-M2 §18 #12). Should they ever break: delete
          # them and pin the two gnu jobs above to `os: ubuntu-22.04` instead (install.sh then
          # falls back from the missing musl asset to gnu by itself).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # SPEC-M2.2 §3: the Windows client (kioku.exe). Not code-signed: SmartScreen may warn.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p kioku-cli --target ${{ matrix.target }}
          else
            cargo build --release --locked -p kioku-cli --target ${{ matrix.target }}
          fi
      # SPEC-M2 §10.3.1: Developer ID signature (+ notarization) when the secrets exist, so
      # firewalls and Local Network privacy keep recognising kioku across updates; otherwise
      # ad hoc with the stable identifier dev.kioku.kioku.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: sh scripts/sign-macos.sh "target/${{ matrix.target }}/release/kioku"
      - name: Package
        shell: bash
        run: |
          name="kioku-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin=kioku
          if [ "${{ runner.os }}" = Windows ]; then bin=kioku.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md README.ja.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$name.tar.gz" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$name.tar.gz" | cut -d' ' -f1)
          fi
          # `<hex>  <file>` on every OS (Git Bash's sha256sum may mark binary mode with `*`).
          printf '%s  %s\n' "$sum" "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kioku-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        # One file with every asset's checksum; install.sh verifies against it (and falls
        # back to <asset>.sha256 for releases that predate it).
        run: |
          cd dist && cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release tag (`v1.2.3-rc1`, `v0.0.0-test1`) makes a GitHub pre-release, which
        # never becomes `releases/latest` (what install.sh, install.ps1 and `kioku update` use).
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
