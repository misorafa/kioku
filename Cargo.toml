[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
kioku-core = { path = "crates/kioku-core" }
kioku-server = { path = "crates/kioku-server" }
tantivy = "0.26"
lindera-tantivy = "5"
lindera-analysis = "5"  # already a lindera-tantivy dependency; used for the NFKC character filter
lindera = { version = "5", features = ["embed-ipadic"] }
rmcp = { version = "3.4", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
parking_lot = "0.12"
tempfile = "3"
