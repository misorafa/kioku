[package]
name = "kioku-cli"
description = "the kioku command-line binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kioku_cli"
path = "src/lib.rs"

[[bin]]
name = "kioku"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kioku-core.workspace = true
kioku-server.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["transport-io"] }
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
rmcp = { workspace = true, features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
